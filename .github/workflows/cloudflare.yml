name: Validate Cloudflare Sandbox

on:
  pull_request:
    paths:
      - deploy/cloudflare/**
      - .github/workflows/cloudflare.yml

permissions:
  contents: read

jobs:
  worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/cloudflare
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npx --yes wrangler@4.147.0 deploy --dry-run
