name: Publish Sandbox Images On Main Push

# The sandbox images are independent of the drukbox application code, so they
# only rebuild when their own build context (or this workflow) changes.
# `local` is the docker provider's sandbox; `sbx` is the Docker Sandboxes
# (docker-sbx provider) microVM template — the default DOCKER_SBX_DEFAULT_IMAGE
# name, so the daemon can pull it instead of requiring `sbx template load`.
on:
  push:
    branches:
      - main
    paths:
      - images/local/**
      - images/sbx/**
      - .github/workflows/publish-sandbox-image.yml
  workflow_dispatch:

concurrency:
  group: sandbox-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish-sandbox-image:
    name: Build And Publish ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - context: images/local
            image: sandbox
          - context: images/sbx
            image: sbx-sandbox

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract sandbox image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push sandbox image
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.context }}
          file: ./${{ matrix.context }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
