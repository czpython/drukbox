name: Validate Vercel Sandbox Image

on:
  pull_request:
    paths:
      - images/vercel/**
      - .github/workflows/vercel.yml

permissions:
  contents: read

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: docker build -t drukbox-vercel:check images/vercel
      - run: docker run --rm drukbox-vercel:check tailscale version
